   <h1>Carl's Chess...</h1>
   <p class="subtitle">Carl did very well today at the Richland tournament. He got the first place trophy for second grade. Five matches: 3 wins, 2 ties, gave him 4 (out of 5) points. WOW!! Undefeated for the day. Nice job Carl. That qualifies him for state.</p>

         <img src="dscn4017.jpg" alt="The room after Carl's first game">
         <figcaption>Carl's first game was over in a flash. I think he checkmated in about 45 seconds and was the very first player in the room to finish. Not much pondering in that game. This picture shows the board reset and Carl off somewhere registering the win. Everyone else in the room was still playing. Long wait till the next game; about 1 per hour.</figcaption>
